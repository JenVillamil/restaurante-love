 <!-- Validacion de credencial -->
            <script>
                function verificarCredenciales() {
                    const email = document.getElementById("email").value;
                    const password = document.getElementById("password").value;
                
                    // Usuario y contraseña "válidos"
                    const usuarioValido = "admin@love.com";
                    const contrasenaValida = "123456";
                
                    if (email === usuarioValido && password === contrasenaValida) {
                        window.location.href = "pagIni.html"; // Redirige si es correcto
                    } else {
                        alert("Correo o contraseña incorrectos por valide su usuario de adminitrador");
                    }
                }
            </script>
